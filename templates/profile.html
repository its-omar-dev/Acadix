<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملفي الشخصي - Acadix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#060918;color:#ece7d6;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
    .card{width:min(100%,480px);padding:30px;border:1px solid #232c5c;border-radius:20px;background:#0c1230;box-shadow:0 20px 70px #0005}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#98a0c4;margin:0 0 24px}
    label{display:block;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #303a70;border-radius:10px;background:#080e25;color:#fff;font:inherit}
    button,.link{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#f2c14e;color:#1b1500;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
    .link{border:1px solid #303a70;background:#111a3a;color:#ece7d6}.error{padding:10px;border-radius:9px;background:#4a202c;color:#ffc5ce}
    .success{padding:10px;border-radius:9px;background:#173b32;color:#b8f4dc}.email{padding:12px;border:1px solid #303a70;border-radius:10px;color:#98a0c4;direction:ltr;text-align:left}
  </style>
</head>
<body>
  <main class="card">
    <h1>ملفي الشخصي</h1>
    <p class="muted">إدارة بيانات حساب Acadix.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% with messages = get_flashed_messages() %}{% for message in messages %}<p class="success">{{ message }}</p>{% endfor %}{% endwith %}
    <p class="email">{{ user.email }}</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="display_name">الاسم الظاهر</label>
      <input id="display_name" name="display_name" value="{{ user.display_name }}" maxlength="80" minlength="2" required>
      <button type="submit">حفظ التغييرات</button>
    </form>
    <a class="link" href="/">العودة إلى Acadix</a>
  </main>
</body>
</html>
